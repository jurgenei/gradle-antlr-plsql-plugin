name: CodeQL

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (Java)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: ["java"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure gradle-antlr-plugin is available
        shell: bash
        run: |
          set -euo pipefail
          ROOT_PARENT="$(dirname "$GITHUB_WORKSPACE")"
          OWNER="${GITHUB_REPOSITORY_OWNER}"

          if [ -d "$ROOT_PARENT/gradle-antlr-plugin/.git" ]; then
            echo "gradle-antlr-plugin already present"
            exit 0
          fi

          if git clone --depth 1 "https://github.com/$OWNER/gradle-antlr-plugin.git" "$ROOT_PARENT/gradle-antlr-plugin"; then
            echo "Cloned $OWNER/gradle-antlr-plugin"
            exit 0
          fi

          if git clone --depth 1 "https://github.com/jurgenei/gradle-antlr-plugin.git" "$ROOT_PARENT/gradle-antlr-plugin"; then
            echo "Cloned jurgenei/gradle-antlr-plugin"
            exit 0
          fi

          echo "Could not clone required gradle-antlr-plugin"
          exit 1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
